name: Lock reminder

# Sends a push notification to your phone at 10 AM Central every day.
# GitHub schedules run in UTC, so there's one run for daylight time and one for
# standard time; the script only sends from the one that lands at 10 AM Central.
on:
  schedule:
    - cron: '0 15 * * *'   # 10 AM CDT
    - cron: '0 16 * * *'   # 10 AM CST
  workflow_dispatch: {}    # "Run workflow" button for a test send

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node .github/scripts/send-reminder.mjs
        env:
          # Your phone, then one secret per extra person (PUSH_CONFIG_2 ... PUSH_CONFIG_15)
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          PUSH_CONFIG_2: ${{ secrets.PUSH_CONFIG_2 }}
          PUSH_CONFIG_3: ${{ secrets.PUSH_CONFIG_3 }}
          PUSH_CONFIG_4: ${{ secrets.PUSH_CONFIG_4 }}
          PUSH_CONFIG_5: ${{ secrets.PUSH_CONFIG_5 }}
          PUSH_CONFIG_6: ${{ secrets.PUSH_CONFIG_6 }}
          PUSH_CONFIG_7: ${{ secrets.PUSH_CONFIG_7 }}
          PUSH_CONFIG_8: ${{ secrets.PUSH_CONFIG_8 }}
          PUSH_CONFIG_9: ${{ secrets.PUSH_CONFIG_9 }}
          PUSH_CONFIG_10: ${{ secrets.PUSH_CONFIG_10 }}
          PUSH_CONFIG_11: ${{ secrets.PUSH_CONFIG_11 }}
          PUSH_CONFIG_12: ${{ secrets.PUSH_CONFIG_12 }}
          PUSH_CONFIG_13: ${{ secrets.PUSH_CONFIG_13 }}
          PUSH_CONFIG_14: ${{ secrets.PUSH_CONFIG_14 }}
          PUSH_CONFIG_15: ${{ secrets.PUSH_CONFIG_15 }}
          SCHEDULE: ${{ github.event.schedule }}
